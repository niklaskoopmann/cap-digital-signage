<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Calendar - Today</title>
  <style>
    :root {
      --blue: #0058AB;
      --light-blue: #1DB8F2;
      --dark-blue: #121A38;
      --white: #FFFFFF;
      --turquoise: #00D5D0;
      --yellow: #FEB100;
      --orange: #FF816E;
      --lilac: #D4D3F1;
      --teal: #00828E;
      --terracotta: #BE4D00;
      --deep-red: #8F3237;
      --purple: #71609E;
      --glass: rgba(18, 26, 56, 0.62);
      --glass-strong: rgba(10, 18, 40, 0.74);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #f5fbff;
      --muted: rgba(255, 255, 255, 0.8);
      --shadow: 0 20px 48px rgba(18, 26, 56, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Ubuntu", "Segoe UI", Arial, sans-serif;
      background: url("template_resources/template_background.jpeg") center center / cover no-repeat;
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      padding: 36px 32px 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: linear-gradient(180deg, rgba(18, 26, 56, 0.18), rgba(18, 26, 56, 0.32));
    }

    .header {
      background: rgba(18, 26, 56, 0.58);
      backdrop-filter: blur(6px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 28px;
    }

    .header {
      border-left: 6px solid var(--light-blue);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(2.1rem, 3vw, 3.3rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
      color: var(--white);
    }

    .header .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      font-weight: 500;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 9px 16px;
      background: rgba(29, 184, 242, 0.18);
      border: 1px solid rgba(29, 184, 242, 0.3);
      color: var(--white);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .list {
      display: grid;
      gap: 18px;
    }

    .event-card {
      position: relative;
      background: rgba(18, 26, 56, 0.62);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-left: 8px solid var(--light-blue);
      border-radius: 22px;
      padding: 22px 24px 20px 24px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .event-time {
      color: var(--light-blue);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .event-subject {
      font-size: clamp(1.45rem, 2vw, 2.15rem);
      line-height: 1.18;
      font-weight: 700;
      color: var(--white);
    }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .empty-state {
      border: 1px dashed rgba(255, 255, 255, 0.32);
      background: rgba(18, 26, 56, 0.56);
      border-radius: 22px;
      padding: 42px 24px;
      text-align: center;
      color: var(--muted);
      font-size: clamp(1.25rem, 2vw, 1.8rem);
      box-shadow: var(--shadow);
    }

    .footer {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 22px 28px;
    }

    @media (max-width: 900px) {
      .page { padding: 20px 18px; }
      .header, .footer { padding: 20px 20px; border-radius: 18px; }
      .event-card { padding: 18px 18px 16px; border-radius: 18px; }
      .meta-item { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="header">
      <h1>Office Calendar Hamburg - Today</h1>
      <p class="subtitle">Aug 24, 2026 - Aug 24, 2026</p>
      <div class="stats">
        
          <span class="pill">3 events</span>
        
        
      </div>
    </section>
    <section class="list">
      
        
        <article class="event-card">
          <div class="event-time">📅 10:00 (30m)</div>
          <div class="event-subject">Team Standup</div>
          <div class="event-meta">
            <span class="meta-item">📍 Conference Room A</span>
            <span class="meta-item">⭐ Alice Johnson</span>
          </div>
        </article>
        
        <article class="event-card">
          <div class="event-time">📅 14:30 (1h)</div>
          <div class="event-subject">Project Review &amp; Planning</div>
          <div class="event-meta">
            <span class="meta-item">📍 Building 2, Floor 3</span>
            <span class="meta-item">⭐ Bob Smith</span>
          </div>
        </article>
        
        <article class="event-card">
          <div class="event-time">📅 All day</div>
          <div class="event-subject">All hands meeting</div>
          <div class="event-meta">
            
            <span class="meta-item">⭐ Management</span>
          </div>
        </article>
        
      
    </section>
    <section class="footer">
      Last updated: 2026-08-24 16:45 UTC
    </section>
  </main>
</body>
</html>
